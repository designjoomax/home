<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Kerja - Demo Konfigurasi</title>
<link rel="stylesheet" href="css/demo.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Jadwal Kerja</b><span>Demo Konfigurasi</span></div>
  <div class="tools">
    <label class="sw" title="Klik teks, bar shift, atau label di preview untuk langsung membuka pengaturannya"><input type="checkbox" id="edit"><i></i>Edit via klik di preview</label>
    <div class="seg" id="wd" title="Lebar preview"><button data-w="100%" class="on">Penuh</button><button data-w="820px">Tablet</button><button data-w="400px">HP</button></div>
    <button id="reset">Reset</button>
    <button id="open" title="Buka lagi pengaturan dari file jadwal-kerja.config.js hasil unduhan">Buka config</button>
    <button class="pri" data-dl="config">Unduh pengaturan (.js)</button>
  </div>
</header>

<main class="app">
  <aside class="side">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </aside>
  <section class="stage">
    <div class="pvbox">
      <div class="pvin" id="pvin"><div id="pv"></div></div>
      <p class="hint" id="hint"></p>
    </div>
    <section class="code">
      <h4>Simpan hasil</h4>
      <p class="hint">Unduh file pengaturan, lalu timpa file lama di folder <b>Jadwal Kerja</b>: <code>js/jadwal-kerja.config.js</code> (pengaturan) dan <code>data/products.json</code> (harga checkout). Tidak perlu salin-tempel kode, dan <code>index.html</code> tidak perlu diubah.</p>
      <div class="dls">
        <button class="pri" data-dl="config">Unduh pengaturan (.js)</button>
        <button data-dl="json">Unduh products.json</button>
        <button data-dl="zip">Unduh keduanya (.zip)</button>
      </div>
      <details>
        <summary>Lihat isi pengaturan (hanya baca)</summary>
        <textarea id="out" readonly></textarea>
      </details>
    </section>
  </section>
</main>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cfgfile" accept=".html,.htm,.js,.json,text/html" hidden>
<div id="picker" class="picker" hidden></div>
<div id="toast" role="status"></div>
<script src="js/jadwal-kerja.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
